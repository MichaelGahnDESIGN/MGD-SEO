[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgd-seo"
version = "0.2.0"
description = "Nachvollziehbare lokale SEO-Prüfungen und Skill für KI-Agenten"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael Gahn DESIGN"}]
dependencies = []

[project.scripts]
mgd-seo = "mgd_seo.cli:main"

[tool.setuptools.packages.find]
include = ["mgd_seo*"]
